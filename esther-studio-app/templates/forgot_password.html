<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password — Studio Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <img src="https://cdn.prod.website-files.com/63ee391d6609d63fbc92b869/640f16c3a90a2d4d45e15ad9_nav-logo.svg" alt="Esther Sims Studio">
      <h1>Reset password</h1>
      <p class="tag">Enter your recovery code and a new password below.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post">
        <div class="field">
          <label for="recovery_code">Recovery code</label>
          <input type="text" id="recovery_code" name="recovery_code" required autofocus>
        </div>
        <div class="field">
          <label for="email">Account email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" required minlength="8">
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input type="password" id="confirm" name="confirm" required minlength="8">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Reset password</button>
        </div>
      </form>
      <p class="tag" style="margin-top:1rem;">
        <a href="{{ url_for('login') }}">Back to log in</a>
      </p>
    </div>
  </div>
</body>
</html>
