{% extends "base.html" %}
{% block title %}New invoice{% endblock %}
{% block content %}
<div class="page-header"><h1>New invoice</h1><p class="subtitle">for {{ commission.type }}</p></div>

<form method="post" class="card" style="max-width:480px;">
  <div class="field">
    <label for="kind">Invoice for</label>
    <select id="kind" name="kind">
      {% for k in ['Deposit', 'Balance', 'Full Payment'] %}
        <option value="{{ k }}" {{ 'selected' if k == default_kind }}>{{ k }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="amount">Amount ({{ settings.currency_symbol }})</label>
    <input type="text" id="amount" name="amount" value="{{ '%.2f'|format(default_amount/100) }}">
  </div>
  <div class="field-row">
    <div class="field">
      <label for="issued_date">Issue date</label>
      <input type="date" id="issued_date" name="issued_date" value="{{ today }}">
    </div>
    <div class="field">
      <label for="due_date">Due date</label>
      <input type="date" id="due_date" name="due_date">
    </div>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Create invoice</button>
    <a href="{{ url_for('commission_detail', commission_id=commission.id) }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
